name: Build and Release ApexLoad

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller ApexLoad.spec --noconfirm

      - name: Compile Inno Setup Installer
        run: |
          iscc installer/installer.iss

      - name: Create Portable Zip Archive
        run: |
          Compress-Archive -Path dist/ApexLoad/* -DestinationPath dist/ApexLoad-v1.0.0-portable-win64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/installer/ApexLoad-Setup-x64.exe
            dist/ApexLoad-v1.0.0-portable-win64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
